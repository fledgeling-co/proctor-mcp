# Build, sign, notarise and publish a Proctor release when a v* tag is pushed.
#
# Trigger:  git tag v0.1.1 && git push origin v0.1.1   (or run manually)
#
# Required repository secrets (Settings > Secrets and variables > Actions).
# These let CI sign and notarise as you, so keep them to this repo:
#   DEVELOPER_ID_CERT_P12_BASE64  base64 of your exported Developer ID
#                                 Application cert incl. private key (.p12):
#                                   security find-identity -v -p codesigning   # find it
#                                   # export via Keychain Access > right-click > Export (.p12)
#                                   base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_CERT_PASSWORD    the password you set on that .p12 export
#   KEYCHAIN_PASSWORD             any throwaway string; names the temp CI keychain
#   NOTARY_KEY_P8_BASE64          base64 of your App Store Connect API key (.p8):
#                                   base64 -i AuthKey_XXXX.p8 | pbcopy
#   NOTARY_KEY_ID                 the API key's Key ID
#   NOTARY_ISSUER_ID             the API key's Issuer ID (a UUID)
#
# The release notes are pulled from the matching section of CHANGELOG.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Check the tag, the app version and the CHANGELOG agree
        # First, before the build: the plist version is compiled into the binaries,
        # so a tag that disagrees with it ships an app that misreports its release.
        # Failing here costs seconds; failing after notarisation costs a round trip.
        run: scripts/check-release-version.sh "$TAG"

      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Import the Developer ID signing certificate
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the imported keychain" >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build and sign
        run: scripts/build-app.sh "$SIGN_IDENTITY"

      - name: Notarise and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          NOTARY_KEY="$KEY_PATH" NOTARY_KEY_ID="$NOTARY_KEY_ID" NOTARY_ISSUER_ID="$NOTARY_ISSUER_ID" \
            scripts/notarize.sh
          rm -f "$KEY_PATH"

      - name: Package the stapled app
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Apps/Proctor/Info.plist)"
          ASSET="Proctor-${VERSION}.zip"
          ditto -c -k --keepParent .build/Proctor.app "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${VERSION}"
          # Pull the section for this version: from "## [VER]" to the next "## [".
          # An exact prefix compare, matching scripts/check-release-version.sh: in a
          # regex the dots in a version match any character, so the wrong heading
          # could win the slice.
          awk -v target="## [$VER]" '
            substr($0, 1, length(target)) == target {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          # `test -s` is not the check here: an empty section extracts to a single
          # newline, which is a non-empty file, so the fallback below would never
          # fire for the case it was written for and the release would ship blank
          # notes. The pre-build check already refuses that, and this keeps the two
          # rules the same rule.
          if ! grep -q '[^[:space:]]' notes.md; then
            printf 'Proctor %s. See CHANGELOG.md for details.\n' "$VER" > notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ASSET" \
            --title "Proctor $VERSION" \
            --notes-file notes.md \
            --latest

      - name: Clean up the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
