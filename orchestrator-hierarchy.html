<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Proctor fleet — orchestrator hierarchy</title>
<style>
:root{--bg:#0A0A0C;--panel:#151519;--line:rgba(255,255,255,.1);--ink:#F7F4F0;--ink2:rgba(247,244,240,.6);
--accent:#F1552A;--queued:#6B7280;--running:#4EA1FF;--merge:#F0A83A;--merged:#3AD07E;--parked:#FF5F57;}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:32px}
h1{font-size:20px;letter-spacing:-.02em}
.sub{color:var(--ink2);font:12px/1.5 ui-monospace,Menlo,monospace;margin:6px 0 24px}
.wave{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;background:linear-gradient(180deg,var(--panel),#0E0E12)}
.wave h2{font:600 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.cards{display:flex;flex-wrap:wrap;gap:12px}
.card{width:250px;border:1px solid var(--line);border-radius:11px;padding:13px;background:rgba(255,255,255,.02);position:relative}
.card .id{font:600 12px/1 ui-monospace,monospace;color:var(--ink)}
.card .t{font-size:13px;margin:7px 0 9px}
.card .meta{font:11px/1.5 ui-monospace,monospace;color:var(--ink2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.badge{position:absolute;top:11px;right:11px;font:600 9px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink2)}
.dep{color:var(--accent)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font:11px/1 ui-monospace,monospace;color:var(--ink2);margin-top:8px}
.legend span{display:flex;align-items:center}
</style>
</head>
<body>
<h1>Proctor — remaining-work fleet</h1>
<div class="sub">10 items · Swift-adapted (gate: swift build + swift test) · ≤8 concurrent · external-model-clis: off · Updated 2026-08-13 (Planning)</div>

<div class="wave">
  <h2>Wave 1 — ready now (8 slots)</h2>
  <div class="cards" id="w1"></div>
</div>
<div class="wave">
  <h2>Wave 2 — after dependencies merge</h2>
  <div class="cards" id="w2"></div>
</div>

<div class="legend">
  <span><i class="dot" style="background:var(--queued)"></i>queued</span>
  <span><i class="dot" style="background:var(--running)"></i>running</span>
  <span><i class="dot" style="background:var(--merge)"></i>ready-to-merge</span>
  <span><i class="dot" style="background:var(--merged)"></i>merged</span>
  <span><i class="dot" style="background:var(--parked)"></i>parked</span>
</div>

<script>
const items=[
 ['PRO-0001','CUA schema façade','maps Anthropic/OpenAI CUA schema onto act',null,1],
 ['PRO-0002','Set-of-marks captures','numbered marks + grid + mark→AX-id map',null,1],
 ['PRO-0003','Menu-bar key-equivalents','AXMenuBar walk + shortcuts',null,1],
 ['PRO-0004','App scripting-dictionary','sdef parse, cached per PID',null,1],
 ['PRO-0005','Audit trail + policy gate','allow/block, approval token, redacting JSONL',null,1],
 ['PRO-0006','Vision-capture normalisation','scale to vision ceiling + report factor',null,1],
 ['PRO-0007','Zoom region crop','native-res region crop',null,1],
 ['PRO-0008','MCP surface modernization','profiles, resources, annotations, outputSchema',null,1],
 ['PRO-0009','Process kill + fs jail','test setup/teardown + containment','PRO-0008 (soft)',2],
 ['PRO-0010','Pointer overlay in captures','target marker in flow/stability artifacts','PRO-0002',2],
];
const status='queued'; // all queued at plan time
const colour={queued:'var(--queued)',running:'var(--running)','ready-to-merge':'var(--merge)',merged:'var(--merged)',parked:'var(--parked)'};
for(const [id,title,note,dep,wave] of items){
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div class="badge">opus</div>
    <div class="id"><i class="dot" style="background:${colour[status]}"></i>${id}</div>
    <div class="t">${title}</div>
    <div class="meta">${note}</div>
    ${dep?`<div class="meta dep" style="margin-top:6px">↳ after ${dep}</div>`:''}`;
  document.getElementById(wave===1?'w1':'w2').appendChild(c);
}
</script>
</body>
</html>
